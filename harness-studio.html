<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity Studio — Kanban &amp; SPEC</title>
  <style>
    :root {
      --bg: #090d16; --surface: #111726; --elevated: #182238; --border: #232f48;
      --primary: #38bdf8; --text: #f1f5f9; --muted: #94a3b8; --green: #10b981;
      --red: #f43f5e; --amber: #f59e0b; --purple: #c084fc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    .sidebar { width: 280px; background: var(--surface); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 14px; flex-shrink: 0; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: 60px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; gap: 12px; }
    .tabs { display: flex; gap: 8px; }
    .tab-btn { padding: 7px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: transparent; color: var(--muted); font-size: 0.85rem; }
    .tab-btn.active { background: rgba(56, 189, 248, 0.15); color: var(--primary); border-color: var(--primary); }
    .viewport { flex: 1; overflow-y: auto; padding: 24px; }
    .banner { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; display: none; align-items: center; justify-content: space-between; gap: 12px; font-size: 0.85rem; }
    .banner.error { display: flex; background: rgba(244, 63, 94, 0.12); border: 1px solid var(--red); color: #fda4af; }
    .banner.warn { display: flex; background: rgba(245, 158, 11, 0.12); border: 1px solid var(--amber); color: #fcd34d; }
    .kanban-grid { display: grid; grid-template-columns: repeat(5, minmax(260px, 1fr)); gap: 16px; min-height: 78vh; overflow-x: auto; padding-bottom: 20px; }
    .kanban-col { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; transition: background 0.2s; }
    .kanban-col.drag-over { background: rgba(56, 189, 248, 0.05); border-color: var(--primary); }
    .card { background: var(--elevated); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 12px; cursor: grab; transition: all 0.15s; }
    .card:active { cursor: grabbing; }
    .card:hover { border-color: var(--primary); transform: translateY(-2px); }
    .badge { font-size: 0.7rem; padding: 2px 7px; border-radius: 4px; background: rgba(56,189,248,0.15); color: var(--primary); font-weight: 600; }
    .btn { padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--elevated); color: var(--text); }
    .btn-primary { background: var(--primary); color: #04101e; border: none; font-weight: 700; }
    .btn-green { background: rgba(16,185,129,0.2); color: #34d399; border: 1px solid #10b981; }
    .btn-red { background: rgba(244,63,94,0.2); color: #fb7185; border: 1px solid #f43f5e; }

    .spec-viewer { max-width: 920px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 28px; line-height: 1.65; display: none; }
    .spec-viewer h1, .spec-viewer h2, .spec-viewer h3 { color: #fff; margin: 18px 0 8px; }
    .spec-viewer h1 { font-size: 1.45rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-top: 0; }
    .spec-viewer h2 { font-size: 1.15rem; color: var(--primary); }
    .spec-viewer h3 { font-size: 1rem; color: var(--purple); }
    .spec-viewer p { margin: 8px 0; color: var(--text); }
    .spec-viewer ul { margin: 8px 0 12px 20px; }
    .spec-viewer li { margin: 4px 0; }
    .spec-viewer pre { background: #070a12; border: 1px solid var(--border); border-radius: 6px; padding: 12px; overflow-x: auto; margin: 10px 0; font-family: ui-monospace, Consolas, monospace; font-size: 0.85rem; }
    .spec-viewer code { background: #070a12; padding: 2px 5px; border-radius: 4px; font-family: ui-monospace, Consolas, monospace; font-size: 0.85em; color: #7dd3fc; }

    .modal-backdrop { position: fixed; inset: 0; background: rgba(3,6,12,0.85); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 680px; max-height: 90vh; overflow-y: auto; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; background: #070a12; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; font-size: 0.9rem; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px;">
      <div style="width:34px; height:34px; background:linear-gradient(135deg,var(--primary),var(--purple)); border-radius:8px; display:flex; align-items:center; justify-content:center; font-weight:800; color:#000;">A²</div>
      <div>
        <h2 style="font-size:0.95rem;">Antigravity Studio</h2>
        <span style="font-size:0.72rem; color:var(--primary);">v4 · board.json + SPEC.md</span>
      </div>
    </div>

    <div style="font-size:0.8rem; color:var(--muted); line-height:1.4; background:rgba(255,255,255,0.03); padding:10px; border-radius:6px; border:1px solid var(--border);">
      💡 Persistência estruturada em <code>_specs/board.json</code> com trava otimista (<code>lastModified</code>) para evitar conflitos com subagentes.
    </div>

    <div style="margin-top:auto; display:flex; flex-direction:column; gap:8px;">
      <button type="button" class="btn btn-primary" id="btn-connect" onclick="connectDirectory()">📁 Conectar Pasta do Projeto</button>
      <button type="button" class="btn" onclick="openNewTaskModal()">＋ Nova Tarefa</button>
      <button type="button" class="btn" onclick="manualReload()">🔄 Recarregar _specs/</button>
      <span id="sync-status" style="font-size:0.75rem; color:var(--muted); text-align:center;">Verificando conexão...</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="tabs">
        <button type="button" class="tab-btn active" id="tab-kanban" onclick="switchTab('kanban')">📋 Quadro Kanban</button>
        <button type="button" class="tab-btn" id="tab-spec" onclick="switchTab('spec')">📄 SPEC.md (Leitura)</button>
      </div>
      <span style="font-size:0.8rem; color:var(--muted);" id="last-sync-time">Aguardando conexão...</span>
    </header>

    <div class="viewport">
      <div id="status-banner" class="banner"></div>
      <div class="kanban-grid" id="kanban-board"></div>
      <article class="spec-viewer" id="spec-viewer"></article>
    </div>
  </main>

  <!-- MODAL DE INSPEÇÃO / CRIAÇÃO -->
  <div class="modal-backdrop" id="task-modal" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:16px; border-bottom:1px solid var(--border); padding-bottom:12px;">
        <div>
          <span class="badge" id="m-task-id-badge" style="font-size:0.8rem;">TASK</span>
          <h3 id="m-title-display" style="font-size:1.15rem; margin-top:6px; color:#fff;"></h3>
        </div>
        <button class="btn" onclick="closeModal()">✕</button>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div class="form-group">
          <label>ID da Tarefa</label>
          <input type="text" id="m-task-id" placeholder="TASK-01">
        </div>
        <div class="form-group">
          <label>Status / Coluna</label>
          <select id="m-task-col">
            <option value="backlog">1. Backlog &amp; Specs</option>
            <option value="red">2. Fase RED (TDD)</option>
            <option value="green">3. Fase GREEN (Código)</option>
            <option value="review">4. Gate de Aprovação</option>
            <option value="done">5. Concluído</option>
          </select>
        </div>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;">
        <div class="form-group">
          <label>Agente</label>
          <input type="text" id="m-task-agent" placeholder="hydrogen">
        </div>
        <div class="form-group">
          <label>Dificuldade</label>
          <input type="text" id="m-task-difficulty" placeholder="Média">
        </div>
        <div class="form-group">
          <label>Skills (vírgula)</label>
          <input type="text" id="m-task-skills" placeholder="clean-architecture">
        </div>
      </div>

      <div class="form-group">
        <label>Título da Tarefa</label>
        <input type="text" id="m-task-title">
      </div>

      <div class="form-group">
        <label>Especificação Técnica &amp; Critérios</label>
        <textarea id="m-task-desc" rows="4"></textarea>
      </div>

      <div class="form-group" id="group-feedback">
        <label style="color:#fb7185;">⚠️ Feedback de Reprovação</label>
        <input type="text" id="m-task-feedback" placeholder="Informe o motivo da reprovação...">
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:20px; padding-top:14px; border-top:1px solid var(--border);">
        <button type="button" class="btn btn-red" id="btn-delete-task" onclick="deleteCurrentTask()">Excluir</button>
        <div style="display:flex; gap:8px;">
          <button type="button" class="btn btn-red" id="btn-reject-task" onclick="rejectTaskAction()">✖ Reprovar (RED)</button>
          <button type="button" class="btn btn-green" id="btn-approve-task" onclick="approveTaskAction()">✔ Aprovar (Done)</button>
          <button type="button" class="btn btn-primary" onclick="saveTaskModal()">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const COLUMNS = [
      { id: "backlog", title: "1. Backlog & Specs", color: "#94a3b8" },
      { id: "red", title: "2. Fase RED (TDD)", color: "#f43f5e" },
      { id: "green", title: "3. Fase GREEN (Código)", color: "#38bdf8" },
      { id: "review", title: "4. Gate de Aprovação", color: "#f59e0b" },
      { id: "done", title: "5. Concluído", color: "#10b981" }
    ];
    const VALID_COLUMNS = new Set(COLUMNS.map(c => c.id));

    let dirHandle = null;
    let boardState = { schemaVersion: 1, lastModified: "", tasks: [] };
    let loadedLastModified = null;
    let loadedFileMtime = null;
    let selectedTaskId = null;
    let isCreatingTask = false;
    let activeTab = "kanban";
    let specMarkdown = "";
    let syncTimer = null;

    const DB_NAME = "AntigravityStudioDB";
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore("handles");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveHandle(handle) {
      const db = await openDB();
      const tx = db.transaction("handles", "readwrite");
      tx.objectStore("handles").put(handle, "project_dir");
    }

    async function getSavedHandle() {
      const db = await openDB();
      return new Promise(resolve => {
        const req = db.transaction("handles").objectStore("handles").get("project_dir");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[ch]));
    }

    function showBanner(type, messageHtml, actionLabel, onAction) {
      const el = document.getElementById("status-banner");
      el.className = "banner " + type;
      el.innerHTML = `<span>${messageHtml}</span>`;
      if (actionLabel && typeof onAction === "function") {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "btn btn-primary";
        btn.textContent = actionLabel;
        btn.onclick = onAction;
        el.appendChild(btn);
      }
    }

    function clearBanner() {
      const el = document.getElementById("status-banner");
      el.className = "banner";
      el.innerHTML = "";
    }

    function validateBoardSchema(data) {
      if (!data || typeof data !== "object" || Array.isArray(data)) {
        return "Raiz do JSON deve ser um objeto.";
      }
      if (data.schemaVersion !== 1) {
        return "schemaVersion inválido (esperado: 1).";
      }
      if (typeof data.lastModified !== "string" || !data.lastModified.trim()) {
        return "Campo lastModified ausente ou vazio.";
      }
      if (!Array.isArray(data.tasks)) {
        return "Campo tasks deve ser um array.";
      }
      const seenIds = new Set();
      for (let i = 0; i < data.tasks.length; i++) {
        const t = data.tasks[i];
        if (!t || typeof t !== "object") return `Tarefa no índice ${i} inválida.`;
        if (typeof t.id !== "string" || !t.id.trim()) return `Tarefa no índice ${i} sem id válido.`;
        if (seenIds.has(t.id)) return `ID duplicado encontrado: ${t.id}`;
        seenIds.add(t.id);
        if (typeof t.title !== "string" || !t.title.trim()) return `Tarefa ${t.id} sem title válido.`;
        if (!VALID_COLUMNS.has(t.column)) return `Tarefa ${t.id} com column inválida: ${t.column}`;
      }
      return null;
    }

    function normalizeSkills(raw) {
      if (Array.isArray(raw)) return raw.map(s => String(s).trim()).filter(Boolean);
      if (typeof raw === "string") return raw.split(",").map(s => s.trim()).filter(Boolean);
      return [];
    }

    function normalizeBoard(data) {
      return {
        schemaVersion: 1,
        lastModified: data.lastModified,
        tasks: data.tasks.map(t => ({
          id: t.id.trim(),
          title: t.title.trim(),
          column: t.column,
          agent: typeof t.agent === "string" && t.agent.trim() ? t.agent.trim() : "hydrogen",
          difficulty: typeof t.difficulty === "string" && t.difficulty.trim() ? t.difficulty.trim() : "Média",
          skills: normalizeSkills(t.skills),
          desc: typeof t.desc === "string" ? t.desc : "",
          feedback: typeof t.feedback === "string" ? t.feedback : ""
        }))
      };
    }

    window.addEventListener("DOMContentLoaded", async () => {
      renderKanban();
      try {
        const saved = await getSavedHandle();
        if (saved) {
          const opts = { mode: "readwrite" };
          if ((await saved.queryPermission(opts)) === "granted" || (await saved.requestPermission(opts)) === "granted") {
            dirHandle = saved;
            onConnected();
            return;
          }
        }
      } catch (e) {
        console.warn("Auto-reconexão falhou:", e);
      }
      document.getElementById("sync-status").innerText = "Pasta não conectada";
    });

    async function connectDirectory() {
      try {
        dirHandle = await window.showDirectoryPicker({ mode: "readwrite" });
        await saveHandle(dirHandle);
        onConnected();
      } catch (e) {
        console.warn("Seleção cancelada:", e);
      }
    }

    function onConnected() {
      document.getElementById("btn-connect").innerText = `📁 ${dirHandle.name}`;
      document.getElementById("sync-status").innerText = `Conectado: ${dirHandle.name}`;
      loadWorkspaceData();
      if (syncTimer) clearInterval(syncTimer);
      syncTimer = setInterval(() => {
        if (!selectedTaskId && !isCreatingTask) loadWorkspaceData();
      }, 3500);
    }

    async function loadWorkspaceData() {
      if (!dirHandle) return;
      await Promise.all([loadBoardJson(), loadSpecMarkdown()]);
      document.getElementById("last-sync-time").innerText = `Sincronizado: ${new Date().toLocaleTimeString()}`;
    }

    async function loadBoardJson() {
      try {
        const specs = await dirHandle.getDirectoryHandle("_specs");
        let fileHandle;
        try {
          fileHandle = await specs.getFileHandle("board.json");
        } catch (notFound) {
          showBanner(
            "warn",
            "⚠️ <strong>_specs/board.json</strong> não encontrado neste projeto.",
            "Inicializar _specs/board.json",
            initializeBoardJson
          );
          return;
        }
        const file = await fileHandle.getFile();
        const text = await file.text();
        let parsed;
        try {
          parsed = JSON.parse(text);
        } catch (jsonErr) {
          showBanner("error", `❌ <strong>_specs/board.json</strong> corrompido (JSON inválido): ${escapeHtml(jsonErr.message)}. Arquivo preservado.`);
          return;
        }
        const schemaErr = validateBoardSchema(parsed);
        if (schemaErr) {
          showBanner("error", `❌ Erro de schema em <strong>_specs/board.json</strong>: ${escapeHtml(schemaErr)} Arquivo preservado.`);
          return;
        }

        clearBanner();
        boardState = normalizeBoard(parsed);
        loadedLastModified = boardState.lastModified;
        loadedFileMtime = file.lastModified;
        renderKanban();
      } catch (e) {
        console.warn("Erro lendo _specs/board.json:", e);
        showBanner("error", `❌ Não foi possível acessar a pasta <strong>_specs/</strong>: ${escapeHtml(e.message)}`);
      }
    }

    async function initializeBoardJson() {
      if (!dirHandle) return;
      const specs = await dirHandle.getDirectoryHandle("_specs", { create: true });
      const fileHandle = await specs.getFileHandle("board.json", { create: true });
      const initial = { schemaVersion: 1, lastModified: new Date().toISOString(), tasks: [] };
      const writable = await fileHandle.createWritable();
      await writable.write(JSON.stringify(initial, null, 2) + "\n");
      await writable.close();
      await loadBoardJson();
    }

    async function loadSpecMarkdown() {
      try {
        const specs = await dirHandle.getDirectoryHandle("_specs");
        const fileHandle = await specs.getFileHandle("SPEC.md");
        const file = await fileHandle.getFile();
        specMarkdown = await file.text();
      } catch (e) {
        specMarkdown = "";
      }
      if (activeTab === "spec") renderSpecViewer();
    }

    function renderKanban() {
      const container = document.getElementById("kanban-board");
      container.innerHTML = COLUMNS.map(col => {
        const colTasks = boardState.tasks.filter(t => t.column === col.id);
        return `
          <div class="kanban-col" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)" ondrop="drop(event, '${col.id}')">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
              <span style="font-weight:700; font-size:0.85rem; color:${col.color};">● ${col.title}</span>
              <span class="badge">${colTasks.length}</span>
            </div>
            <div style="flex:1;">
              ${colTasks.map(t => `
                <div class="card" draggable="true" ondragstart="drag(event, '${escapeHtml(t.id)}')" onclick="openTaskModal('${escapeHtml(t.id)}')">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="badge" style="background:#070a12;">${escapeHtml(t.id)}</span>
                    <span style="font-size:0.7rem; color:var(--muted);">${escapeHtml(t.difficulty)}</span>
                  </div>
                  <div style="font-size:0.92rem; font-weight:600; margin:8px 0 6px; color:#fff;">${escapeHtml(t.title)}</div>
                  ${t.feedback ? `<div style="font-size:0.74rem; color:#fda4af; margin-bottom:6px;">⚠️ ${escapeHtml(t.feedback)}</div>` : ""}
                  <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">
                    <span class="badge" style="background:rgba(192,132,252,0.15); color:var(--purple);">🤖 ${escapeHtml(t.agent)}</span>
                    ${t.skills.length ? `<span class="badge">⚡ ${escapeHtml(t.skills.join(", "))}</span>` : ""}
                  </div>
                </div>
              `).join("")}
              ${colTasks.length === 0 ? `<div style="font-size:0.75rem; color:var(--muted); text-align:center; padding:30px 10px;">Arraste cards para cá</div>` : ""}
            </div>
          </div>
        `;
      }).join("");
    }

    function renderSafeInline(escapedText) {
      return escapedText.replace(/`([^`]+)`/g, "<code>$1</code>");
    }

    function renderSpecViewer() {
      const viewer = document.getElementById("spec-viewer");
      if (!specMarkdown.trim()) {
        viewer.innerHTML = `<p style="color:var(--muted);">Nenhum arquivo <code>_specs/SPEC.md</code> encontrado no projeto conectado.</p>`;
        return;
      }
      const lines = specMarkdown.split(/\r?\n/);
      let html = [];
      let inCode = false;
      let inList = false;

      for (const rawLine of lines) {
        if (rawLine.trim().startsWith("```")) {
          if (inList) { html.push("</ul>"); inList = false; }
          if (!inCode) { html.push("<pre><code>"); inCode = true; }
          else { html.push("</code></pre>"); inCode = false; }
          continue;
        }
        if (inCode) {
          html.push(escapeHtml(rawLine) + "\n");
          continue;
        }
        const safe = escapeHtml(rawLine);
        if (/^###\s+/.test(rawLine)) {
          if (inList) { html.push("</ul>"); inList = false; }
          html.push(`<h3>${renderSafeInline(safe.replace(/^###\s+/, ""))}</h3>`);
        } else if (/^##\s+/.test(rawLine)) {
          if (inList) { html.push("</ul>"); inList = false; }
          html.push(`<h2>${renderSafeInline(safe.replace(/^##\s+/, ""))}</h2>`);
        } else if (/^#\s+/.test(rawLine)) {
          if (inList) { html.push("</ul>"); inList = false; }
          html.push(`<h1>${renderSafeInline(safe.replace(/^#\s+/, ""))}</h1>`);
        } else if (/^\s*-\s+/.test(rawLine)) {
          if (!inList) { html.push("<ul>"); inList = true; }
          const item = safe.replace(/^\s*-\s+/, "")
            .replace(/^\[x\]\s*/i, "✅ ")
            .replace(/^\[\s\]\s*/, "⬜ ");
          html.push(`<li>${renderSafeInline(item)}</li>`);
        } else {
          if (inList) { html.push("</ul>"); inList = false; }
          if (safe.trim()) html.push(`<p>${renderSafeInline(safe)}</p>`);
        }
      }
      if (inList) html.push("</ul>");
      if (inCode) html.push("</code></pre>");
      viewer.innerHTML = html.join("\n");
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById("tab-kanban").classList.toggle("active", tab === "kanban");
      document.getElementById("tab-spec").classList.toggle("active", tab === "spec");
      document.getElementById("kanban-board").style.display = tab === "kanban" ? "grid" : "none";
      document.getElementById("spec-viewer").style.display = tab === "spec" ? "block" : "none";
      if (tab === "spec") renderSpecViewer();
    }

    // DRAG AND DROP
    function allowDrop(ev) { ev.preventDefault(); ev.currentTarget.classList.add("drag-over"); }
    function leaveDrop(ev) { ev.currentTarget.classList.remove("drag-over"); }
    function drag(ev, id) { ev.dataTransfer.setData("text/plain", id); }
    async function drop(ev, targetColId) {
      ev.preventDefault();
      ev.currentTarget.classList.remove("drag-over");
      const taskId = ev.dataTransfer.getData("text/plain");
      await mutateBoard(board => {
        const idx = board.tasks.findIndex(t => t.id === taskId);
        if (idx === -1 || board.tasks[idx].column === targetColId) return false;
        board.tasks[idx].column = targetColId;
        return true;
      });
    }

    // CONCORRÊNCIA OTIMISTA + VALIDAÇÃO DE SCHEMA
    async function mutateBoard(mutator) {
      if (!dirHandle) {
        alert("Conecte a pasta do projeto antes de alterar o quadro.");
        return;
      }
      try {
        const specs = await dirHandle.getDirectoryHandle("_specs");
        const fileHandle = await specs.getFileHandle("board.json");
        const diskFile = await fileHandle.getFile();
        const diskText = await diskFile.text();
        const diskData = JSON.parse(diskText);

        const schemaErr = validateBoardSchema(diskData);
        if (schemaErr) {
          showBanner("error", `❌ Gravação abortada: schema inválido no disco (${escapeHtml(schemaErr)}).`);
          return;
        }

        if (loadedLastModified !== null &&
            (diskData.lastModified !== loadedLastModified || diskFile.lastModified !== loadedFileMtime)) {
          showBanner("warn", "⚠️ Conflito externo detectado: <strong>_specs/board.json</strong> foi alterado por outro processo. O quadro foi recarregado sem sobrescrever.");
          boardState = normalizeBoard(diskData);
          loadedLastModified = boardState.lastModified;
          loadedFileMtime = diskFile.lastModified;
          renderKanban();
          return;
        }

        const nextBoard = normalizeBoard(diskData);
        const changed = mutator(nextBoard);
        if (!changed) return;

        nextBoard.lastModified = new Date().toISOString();
        const nextErr = validateBoardSchema(nextBoard);
        if (nextErr) {
          alert("Erro de validação: " + nextErr);
          return;
        }

        const writable = await fileHandle.createWritable();
        await writable.write(JSON.stringify(nextBoard, null, 2) + "\n");
        await writable.close();

        await loadBoardJson();
      } catch (e) {
        console.error("Erro ao gravar _specs/board.json:", e);
        alert("Não foi possível gravar _specs/board.json: " + e.message);
      }
    }

    function openNewTaskModal() {
      isCreatingTask = true;
      selectedTaskId = null;
      document.getElementById("m-task-id-badge").innerText = "NOVA";
      document.getElementById("m-title-display").innerText = "Criar Nova Tarefa";
      document.getElementById("m-task-id").value = `TASK-${String(boardState.tasks.length + 1).padStart(2, "0")}`;
      document.getElementById("m-task-id").disabled = false;
      document.getElementById("m-task-col").value = "backlog";
      document.getElementById("m-task-agent").value = "hydrogen";
      document.getElementById("m-task-difficulty").value = "Média";
      document.getElementById("m-task-skills").value = "";
      document.getElementById("m-task-title").value = "";
      document.getElementById("m-task-desc").value = "";
      document.getElementById("m-task-feedback").value = "";
      document.getElementById("btn-delete-task").style.display = "none";
      document.getElementById("btn-reject-task").style.display = "none";
      document.getElementById("btn-approve-task").style.display = "none";
      document.getElementById("task-modal").classList.add("open");
    }

    function openTaskModal(id) {
      const t = boardState.tasks.find(x => x.id === id);
      if (!t) return;
      isCreatingTask = false;
      selectedTaskId = id;

      document.getElementById("m-task-id-badge").innerText = t.id;
      document.getElementById("m-title-display").innerText = t.title;
      document.getElementById("m-task-id").value = t.id;
      document.getElementById("m-task-id").disabled = true;
      document.getElementById("m-task-col").value = t.column;
      document.getElementById("m-task-agent").value = t.agent;
      document.getElementById("m-task-difficulty").value = t.difficulty;
      document.getElementById("m-task-skills").value = t.skills.join(", ");
      document.getElementById("m-task-title").value = t.title;
      document.getElementById("m-task-desc").value = t.desc;
      document.getElementById("m-task-feedback").value = t.feedback || "";
      document.getElementById("btn-delete-task").style.display = "inline-block";
      document.getElementById("btn-reject-task").style.display = "inline-block";
      document.getElementById("btn-approve-task").style.display = "inline-block";
      document.getElementById("task-modal").classList.add("open");
    }

    function closeModal() {
      document.getElementById("task-modal").classList.remove("open");
      selectedTaskId = null;
      isCreatingTask = false;
    }

    async function saveTaskModal() {
      const id = document.getElementById("m-task-id").value.trim();
      const title = document.getElementById("m-task-title").value.trim();
      if (!id || !title) return alert("Informe ID e título da tarefa.");

      const payload = {
        id,
        title,
        column: document.getElementById("m-task-col").value,
        agent: document.getElementById("m-task-agent").value.trim() || "hydrogen",
        difficulty: document.getElementById("m-task-difficulty").value.trim() || "Média",
        skills: normalizeSkills(document.getElementById("m-task-skills").value),
        desc: document.getElementById("m-task-desc").value.trim(),
        feedback: document.getElementById("m-task-feedback").value.trim()
      };

      const creating = isCreatingTask;
      const targetId = selectedTaskId;
      closeModal();

      await mutateBoard(board => {
        if (creating) {
          if (board.tasks.some(t => t.id === payload.id)) {
            alert(`Já existe uma tarefa com ID ${payload.id}.`);
            return false;
          }
          board.tasks.push(payload);
          return true;
        }
        const idx = board.tasks.findIndex(t => t.id === targetId);
        if (idx === -1) return false;
        board.tasks[idx] = payload;
        return true;
      });
    }

    async function approveTaskAction() {
      const targetId = selectedTaskId;
      if (!targetId) return;
      closeModal();
      await mutateBoard(board => {
        const idx = board.tasks.findIndex(t => t.id === targetId);
        if (idx === -1) return false;
        board.tasks[idx].column = "done";
        board.tasks[idx].feedback = "";
        return true;
      });
    }

    async function rejectTaskAction() {
      const fb = document.getElementById("m-task-feedback").value.trim();
      if (!fb) return alert("Informe o motivo da reprovação para orientar a IA.");
      const targetId = selectedTaskId;
      if (!targetId) return;
      closeModal();
      await mutateBoard(board => {
        const idx = board.tasks.findIndex(t => t.id === targetId);
        if (idx === -1) return false;
        board.tasks[idx].column = "red";
        board.tasks[idx].feedback = fb;
        return true;
      });
    }

    async function deleteCurrentTask() {
      const targetId = selectedTaskId;
      if (!targetId) return;
      if (!confirm(`Deseja remover a tarefa ${targetId} do quadro?`)) return;
      closeModal();
      await mutateBoard(board => {
        const len = board.tasks.length;
        board.tasks = board.tasks.filter(t => t.id !== targetId);
        return board.tasks.length !== len;
      });
    }

    function manualReload() { loadWorkspaceData(); }
  </script>
</body>
