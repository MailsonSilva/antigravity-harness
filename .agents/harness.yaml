version: "3.3-google-antigravity"
name: "universal-flutter-mobile-harness"
description: "Harness Flutter Mobile agnóstico com Dart MCP Server, governança de Kanban, ciclo TDD e relação 1:N de Skills."

# -------------------------------------------------------------
# 1. Perfis Abstratos de Modelo (Zero Vendor Lock-in)
# -------------------------------------------------------------
model_profiles:
  reasoning: "${AI_MODEL_REASONING:-inherit}"
  coding: "${AI_MODEL_CODING:-inherit}"
  design: "${AI_MODEL_DESIGN:-inherit}"
  fast_ops: "${AI_MODEL_FAST:-inherit}"

# -------------------------------------------------------------
# 2. Configurações Globais
# -------------------------------------------------------------
settings:
  language: "pt-BR"
  enforce_tdd: true
  max_repair_cycles: 3
  task_board: "_specs/task-board.md"
  brain_path: ".agents/PROJECT_BRAIN.md"
  auto_document_on_done: true

# -------------------------------------------------------------
# 3. Workspaces e Comandos Nativos do Flutter
# -------------------------------------------------------------
workspaces:
  mobile:
    path: "./"
    test_command: "flutter test"
    lint_command: "dart analyze"
    format_command: "dart format ."

# -------------------------------------------------------------
# 4. Servidores MCP Conectados
# -------------------------------------------------------------
mcp_servers:
  dart_mcp:
    command: "dart"
    args: ["mcp-server"]
    description: "Servidor oficial Dart/Flutter para runtime inspection, analyzer e testes."
  google_stitch:
    command: "npx"
    args: ["-y", "@google/stitch-mcp-server"]
    description: "Extração de design DNA visual de _references/screens/."
  graft_ast:
    command: "graft"
    args: ["mcp", "--watch"]
    description: "Grafo sintático AST para impacto de código determinístico."
  ai_memory:
    command: "ai-memory"
    args: ["mcp"]
    description: "Memória episódica de longo prazo e handoffs."

# -------------------------------------------------------------
# 5. Catálogo Global das 23 Skills Reais
# -------------------------------------------------------------
skills_registry:
  antigravity_skill_orchestrator: ".agents/skills/antigravity-skill-orchestrator/SKILL.md"
  clean_architecture: ".agents/skills/clean-architecture/SKILL.md"
  code_quality_tests: ".agents/skills/code-quality-tests/SKILL.md"
  dart_collect_coverage: ".agents/skills/dart-collect-coverage/SKILL.md"
  dart_use_pattern_matching: ".agents/skills/dart-use-pattern-matching/SKILL.md"
  flutter_add_integration_test: ".agents/skills/flutter-add-integration-test/SKILL.md"
  flutter_add_widget_test: ".agents/skills/flutter-add-widget-test/SKILL.md"
  flutter_apply_architecture_best_practices: ".agents/skills/flutter-apply-architecture-best-practices/SKILL.md"
  flutter_build_responsive_layout: ".agents/skills/flutter-build-responsive-layout/SKILL.md"
  flutter_release: ".agents/skills/flutter-release/SKILL.md"
  flutter_setup_declarative_routing: ".agents/skills/flutter-setup-declarative-routing/SKILL.md"
  flutter_setup_localization: ".agents/skills/flutter-setup-localization/SKILL.md"
  flutter_state_riverpod: ".agents/skills/flutter-state-riverpod/SKILL.md"
  flutter_use_http_package: ".agents/skills/flutter-use-http-package/SKILL.md"
  harness_evolver: ".agents/skills/harness-evolver/SKILL.md"
  local_first_data: ".agents/skills/local-first-data/SKILL.md"
  mobile_cicd: ".agents/skills/mobile-cicd/SKILL.md"
  mobile_ux: ".agents/skills/mobile-ux/SKILL.md"
  skill_creator: ".agents/skills/skill-creator/SKILL.md"
  spec_discovery: ".agents/skills/spec-discovery/SKILL.md"
  store_publishing: ".agents/skills/store-publishing/SKILL.md"
  supabase_flutter: ".agents/skills/supabase-flutter/SKILL.md"
  web_performance_seo: ".agents/skills/web-performance-seo/SKILL.md"

# -------------------------------------------------------------
# 6. Os 9 Subagentes de Ciclo de Vida (1:N Skills)
# -------------------------------------------------------------
subagents:
  master_orchestrator:
    profile: "reasoning"
    role: "Principal Architect & Master Orchestrator"
    skills:
      - ".agents/skills/spec-discovery/SKILL.md"
      - ".agents/skills/antigravity-skill-orchestrator/SKILL.md"
      - ".agents/skills/clean-architecture/SKILL.md"
      - ".agents/skills/harness-evolver/SKILL.md"

  ui_ux_designer:
    profile: "design"
    role: "Senior UI/UX & Design System Architect"
    skills:
      - ".agents/skills/mobile-ux/SKILL.md"
      - ".agents/skills/flutter-build-responsive-layout/SKILL.md"
      - ".agents/skills/flutter-setup-declarative-routing/SKILL.md"

  tdd_tester:
    profile: "coding"
    role: "Lead TDD & Contract Verification Engineer (Fase RED)"
    skills:
      - ".agents/skills/code-quality-tests/SKILL.md"
      - ".agents/skills/flutter-add-widget-test/SKILL.md"
      - ".agents/skills/flutter-add-integration-test/SKILL.md"

  mobile_builder:
    profile: "coding"
    role: "Senior Flutter Domain & UI Engineer (Fase GREEN)"
    skills:
      - ".agents/skills/clean-architecture/SKILL.md"
      - ".agents/skills/flutter-state-riverpod/SKILL.md"
      - ".agents/skills/dart-use-pattern-matching/SKILL.md"

  data_offline_specialist:
    profile: "coding"
    role: "Offline-First SQLite & Supabase Architect"
    skills:
      - ".agents/skills/local-first-data/SKILL.md"
      - ".agents/skills/supabase-flutter/SKILL.md"
      - ".agents/skills/flutter-use-http-package/SKILL.md"

  qa_validator:
    profile: "coding"
    role: "Autonomous QA Validator & Self-Healing Agent (REFACTOR)"
    skills:
      - ".agents/skills/code-quality-tests/SKILL.md"
      - ".agents/skills/dart-collect-coverage/SKILL.md"

  flutter_a11y_auditor:
    profile: "coding"
    role: "Flutter Accessibility (a11y) & Ergonomics Auditor"
    skills:
      - ".agents/skills/mobile-ux/SKILL.md"
      - ".agents/skills/flutter-add-widget-test/SKILL.md"

  harness_evolver:
    profile: "reasoning"
    role: "Google Harness² Recursive Learning Agent"
    skills:
      - ".agents/skills/harness-evolver/SKILL.md"
      - ".agents/skills/skill-creator/SKILL.md"

  git_committer:
    profile: "fast_ops"
    role: "Atomic Git Committer & Release Specialist"
    skills:
      - ".agents/skills/flutter-release/SKILL.md"
      - ".agents/skills/mobile-cicd/SKILL.md"
