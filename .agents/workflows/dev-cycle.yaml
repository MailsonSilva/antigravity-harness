version: "1.0"
name: "dev-cycle"
description: "Pipeline orientado a Spec com TDD (Red-Green-Refactor), validação estática e Git commit semântico."

# 1. Parâmetros de Entrada
inputs:
  feature_spec:
    type: string
    description: "Caminho da especificação da funcionalidade (ex: _specs/prd-template.md ou _specs/features/nova-tela.md)"
    required: true
  target:
    type: string
    description: "Alvo da execução: mobile | web | landing (se omitido, lê targets de _specs/prd.md)"
    default: "mobile"
  skip_design:
    type: boolean
    description: "Pular inspeção visual para tarefas puramente de lógica ou backend"
    default: false

# 2. Pipeline Sequencial Unificado
steps:
  - id: validate_models
    name: "Pré-condição: Modelos Selecionados (fail-fast)"
    fail_fast: true
    description: "Aborta o pipeline com mensagem clara se qualquer variável de modelo estiver vazia. Defina por tarefa antes de executar — PowerShell: $env:MODEL_REASONING='<seu-modelo>'; Bash: export MODEL_REASONING='<seu-modelo>'. Variáveis exigidas: MODEL_REASONING, MODEL_CODING, MODEL_DESIGN, MODEL_OPS."
    actions:
      - description: "Aborta (exit 1) listando qual variável está vazia"
        command: >
          for v in MODEL_REASONING MODEL_CODING MODEL_DESIGN MODEL_OPS; do
            if [ -z "${!v}" ]; then echo "ERRO: $v não definida. Defina antes de executar (ex: export $v='<seu-modelo>') e rode novamente."; exit 1; fi;
          done

  - id: triage
    name: "0. Triagem Cognitiva e Alocação de Contexto"
    skill: antigravity-skill-orchestrator
    thinking_budget: 1000
    description: "Avalia complexidade da tarefa e define a rota ideal evitando saturação de tokens."

  - id: spec_discovery
    name: "1. Leitura e Análise da Especificação"
    skill: spec-discovery
    thinking_budget: 4000
    description: "Lê ${inputs.feature_spec} e mapeia critérios de aceitação e contratos de interface."

  - id: architecture_review
    name: "2. Arquitetura e Estrutura Limpa"
    skill: clean-architecture
    thinking_budget: 2000
    description: "Valida regras de design, separação de camadas e responsabilidades no código."

  - id: tdd_red_phase
    name: "3. TDD Fase Vermelha (RED) - Escrita de Testes"
    skill: code-quality-tests
    thinking_budget: 2000
    description: "Cria testes unitários ou de integração que devem falhar antes da implementação."

  - id: implementation_green
    name: "4. Implementação de Código (GREEN)"
    thinking_budget: 0
    description: "Escreve o código estritamente necessário para satisfazer os testes e a spec."

  - id: web_performance_audit
    name: "5. Auditoria de Performance e Padrões Web"
    skill: web-performance
    condition: "${inputs.target == 'web' || inputs.target == 'landing'}"
    thinking_budget: 1000
    description: "Verifica renderizações, hidratação, bundle size e Core Web Vitals no Next.js."

  - id: automated_validation_loop
    name: "6. Validação Contínua (Linter, Tipos e Testes)"
    skill: code-quality-tests
    thinking_budget: 1000
    description: "Executa a suíte de testes e o type-check até garantir estabilidade completa."

  - id: git_semantic_commit
    name: "7. Versionamento Semântico no Git"
    thinking_budget: 0
    description: "Gera o commit convencional padronizado refletindo a spec implementada."